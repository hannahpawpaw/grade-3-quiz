<style>
html,body{margin:0}
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}

<title>Grade 3 Quiz Quest</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Andika:wght@400;700&display=swap">
<style>
:root{
  --paper:#EEF5FF;
  --paper2:#FFFFFF;
  --card:#FFFFFF;
  --ink:#1B2B49;
  --ink-soft:#5B6E90;
  --line:#D5E2F6;
  --shadow:rgba(27,43,73,.13);
  --sci:#00A28C;
  --math:#F4761B;
  --eng:#7A4DFF;
  --soc:#DD3F7C;
  --spell:#2B72D8;
  --christ:#B5821A;
  --frac:#2E9E5B;
  --good:#0E9D53;
  --good-bg:#E0F7EA;
  --oops:#D64550;
  --oops-bg:#FDE9EA;
  --gold:#F0A415;
  --star-off:#C9D7EC;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101829;
    --paper2:#18223A;
    --card:#1B2740;
    --ink:#E9F1FF;
    --ink-soft:#9DAFD0;
    --line:#2E3E60;
    --shadow:rgba(0,0,0,.45);
    --sci:#34DFC2;
    --math:#FFA04D;
    --eng:#AE92FF;
    --soc:#FF75A8;
    --spell:#79B6FF;
    --christ:#F0C368;
    --frac:#5FD98A;
    --good:#45D98C;
    --good-bg:#10341F;
    --oops:#FF8A90;
    --oops-bg:#3A1C22;
    --gold:#FFC862;
    --star-off:#36456A;
  }
}
:root[data-theme="dark"]{
  --paper:#101829;
  --paper2:#18223A;
  --card:#1B2740;
  --ink:#E9F1FF;
  --ink-soft:#9DAFD0;
  --line:#2E3E60;
  --shadow:rgba(0,0,0,.45);
  --sci:#34DFC2;
  --math:#FFA04D;
  --eng:#AE92FF;
  --soc:#FF75A8;
  --spell:#79B6FF;
  --christ:#F0C368;
  --frac:#5FD98A;
  --good:#45D98C;
  --good-bg:#10341F;
  --oops:#FF8A90;
  --oops-bg:#3A1C22;
  --gold:#FFC862;
  --star-off:#36456A;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  background-image:
    radial-gradient(60vw 40vw at 8% -5%, color-mix(in srgb, var(--eng) 16%, transparent), transparent 70%),
    radial-gradient(55vw 40vw at 100% 8%, color-mix(in srgb, var(--sci) 16%, transparent), transparent 70%),
    radial-gradient(70vw 45vw at 50% 105%, color-mix(in srgb, var(--math) 13%, transparent), transparent 70%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"Andika","Verdana",system-ui,sans-serif;
  font-size:17px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,.disp{font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;font-weight:600;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--eng);outline-offset:3px;border-radius:8px}

.wrap{max-width:760px;margin:0 auto;padding-inline:18px;padding-block:26px 56px}

/* ---------- home ---------- */
.eyebrow{
  font-family:"Fredoka","Trebuchet MS",sans-serif;
  font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-soft);margin:0 0 10px
}
h1{font-size:clamp(2.3rem,9vw,3.4rem);line-height:1.02;font-weight:700;letter-spacing:-.01em}
h1 .pop{color:var(--math)}
.sub{color:var(--ink-soft);margin:12px 0 0;max-width:46ch}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:28px}
.card:last-child:nth-child(odd){grid-column:1 / -1}
@media (max-width:540px){.grid{grid-template-columns:1fr}}

.card{
  --c:var(--sci);
  display:flex;flex-direction:column;gap:10px;align-items:flex-start;
  text-align:left;background:var(--card);
  border:2px solid var(--line);border-bottom-width:5px;
  border-radius:20px;padding:18px 18px 16px;
  box-shadow:0 5px 0 -2px var(--shadow);
  transition:transform .14s ease, border-color .14s ease;
}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--c)}
.card:active{transform:translateY(0)}
.ic{
  width:52px;height:52px;border-radius:15px;display:grid;place-items:center;
  background:rgba(125,125,125,.16);
  background:color-mix(in srgb, var(--c) 17%, transparent);color:var(--c)
}
.ic svg{width:29px;height:29px}
.card .name{font-family:"Fredoka",sans-serif;font-size:1.32rem;font-weight:600;line-height:1.1}
.card .meta{font-size:.86rem;color:var(--ink-soft);margin:0}
.best{
  display:inline-flex;align-items:center;gap:5px;margin-top:2px;
  font-size:.8rem;font-weight:700;color:var(--gold)
}
.best svg{width:15px;height:15px}

.tipbar{
  display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;
  margin-top:26px;padding:14px 16px;border-radius:16px;
  background:var(--paper2);border:2px dashed var(--line);
  font-size:.88rem;color:var(--ink-soft)
}
.ghost{
  background:transparent;border:2px solid var(--line);border-radius:999px;
  padding:7px 14px;font-family:"Fredoka",sans-serif;font-size:.85rem;color:var(--ink)
}
.ghost:hover{border-color:var(--ink-soft)}

/* ---------- quiz ---------- */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar .title{font-family:"Fredoka",sans-serif;font-size:1.15rem;font-weight:600;flex:1;min-width:120px}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--card);border:2px solid var(--line);border-radius:999px;
  padding:5px 13px;font-family:"Fredoka",sans-serif;font-size:.9rem;font-weight:600
}
.pill svg{width:16px;height:16px;color:var(--gold)}

.track{height:14px;border-radius:999px;background:var(--line);margin:18px 0 6px;overflow:hidden}
.track i{display:block;height:100%;border-radius:999px;background:var(--c,var(--sci));transition:width .35s cubic-bezier(.3,1.4,.5,1)}
.count{font-size:.83rem;color:var(--ink-soft);margin:0 0 18px;font-weight:700;letter-spacing:.04em}

.qcard{
  background:var(--card);border:2px solid var(--line);border-bottom-width:5px;
  border-radius:22px;padding:22px 20px;box-shadow:0 5px 0 -2px var(--shadow)
}
.qtext{font-size:clamp(1.3rem,4.6vw,1.72rem);line-height:1.25;font-weight:600}

.opts{display:flex;flex-direction:column;gap:11px;margin-top:20px}
.opt{
  display:flex;align-items:center;gap:13px;text-align:left;width:100%;
  min-height:62px;padding:12px 15px;
  background:var(--paper2);border:2px solid var(--line);border-radius:16px;
  font-size:1.02rem;line-height:1.35;
  transition:border-color .12s ease, background .12s ease, transform .12s ease
}
.opt:hover:not(:disabled){border-color:var(--c);transform:translateX(3px)}
.opt:disabled{cursor:default}
.opt .ltr{
  flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  background:rgba(125,125,125,.16);
  background:color-mix(in srgb, var(--c) 16%, transparent);color:var(--c);
  font-family:"Fredoka",sans-serif;font-weight:600
}
.opt .mark{flex:none;width:24px;height:24px;margin-left:auto;display:none}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .ltr{background:var(--good);color:#fff}
.opt.right .mark{display:block;color:var(--good)}
.opt.wrong{border-color:var(--oops);background:var(--oops-bg)}
.opt.wrong .ltr{background:var(--oops);color:#fff}
.opt.wrong .mark{display:block;color:var(--oops)}
.opt.dim{opacity:.5}

.fb{
  margin-top:18px;padding:15px 16px;border-radius:16px;border:2px solid;
  animation:pop .28s cubic-bezier(.3,1.5,.5,1)
}
.fb.ok{background:var(--good-bg);border-color:var(--good)}
.fb.no{background:var(--oops-bg);border-color:var(--oops)}
.fb h3{font-size:1.1rem;margin-bottom:4px}
.fb.ok h3{color:var(--good)}
.fb.no h3{color:var(--oops)}
.fb p{margin:0;font-size:.95rem}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.big{
  display:block;width:100%;margin-top:18px;
  background:var(--c,var(--sci));color:#fff;border:none;border-radius:16px;
  padding:16px;font-family:"Fredoka",sans-serif;font-size:1.1rem;font-weight:600;
  box-shadow:0 4px 0 rgba(0,0,0,.3);
  box-shadow:0 4px 0 color-mix(in srgb, var(--c,var(--sci)) 65%, #000)
}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3);box-shadow:0 1px 0 color-mix(in srgb, var(--c,var(--sci)) 65%, #000)}

/* ---------- results ---------- */
.result{text-align:center;padding:30px 20px 26px}
.ring{
  width:168px;height:168px;margin:6px auto 4px;border-radius:50%;
  display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--pct)*1%), var(--line) 0);
}
.ring .inner{
  width:132px;height:132px;border-radius:50%;background:var(--card);
  display:grid;place-items:center;align-content:center
}
.ring .num{font-family:"Fredoka",sans-serif;font-size:2.6rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ring .of{font-size:.82rem;color:var(--ink-soft)}
.stars{display:flex;justify-content:center;gap:8px;margin:16px 0 10px}
.stars svg{width:42px;height:42px;color:var(--star-off)}
.stars svg.lit{color:var(--gold);animation:bounce .5s cubic-bezier(.3,1.6,.5,1) backwards}
.stars svg.lit:nth-child(2){animation-delay:.12s}
.stars svg.lit:nth-child(3){animation-delay:.24s}
@keyframes bounce{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.result h2{font-size:1.6rem}
.result .msg{color:var(--ink-soft);margin:8px auto 0;max-width:34ch}
.row{display:flex;gap:11px;margin-top:22px;flex-wrap:wrap}
.row>*{flex:1 1 160px}
.big.alt{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 -1px var(--shadow)}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="wrap" id="app"></div>

<script>
"use strict";

var SUBJECTS = [
{
  id:"sci", name:"Science", topic:"Light, heat and fuels", color:"var(--sci)", icon:"ic-sci",
  q:[
    {q:"What is a light source?",
     o:["Something that makes its own light","Something that is very shiny","Something that feels hot","Something that blocks light"],
     a:0, why:"A light source produces its own light. Things that only bounce light back, like the Moon, are not light sources."},
    {q:"Which one is a NATURAL light source?",
     o:["The Sun","A flashlight","A lamp","A candle"],
     a:0, why:"Natural light sources happen in nature: the Sun, stars and fire. Candles, lamps and flashlights are made by people."},
    {q:"Which one is made by people, not found in nature?",
     o:["A candle","The Sun","The stars","Fire"],
     a:0, why:"Human-made light sources are created by people: a candle, a lamp or a flashlight. The Sun, stars and fire are natural."},
    {q:"Why is the Moon NOT a light source?",
     o:["It only reflects light from the Sun","It is too far away from us","It only comes out at night","It is smaller than the Sun"],
     a:0, why:"The Moon does not make its own light. It reflects the Sun's light, so it is not a light source."},
    {q:"The Sun is Earth's main source of...",
     o:["Heat and light","Water and air","Food and sleep","Wind and rain"],
     a:0, why:"The Sun gives Earth the heat and light we need. Its energy also helps plants grow."},
    {q:"What would Earth be like without the Sun?",
     o:["Very cold and dark","Very noisy","Much faster","Exactly the same"],
     a:0, why:"Without the Sun, Earth would be very cold and dark, and most living things could not survive."},
    {q:"Which one of these uses HEAT?",
     o:["An iron","A mirror","A window","A pair of glasses"],
     a:0, why:"An iron uses heat to take the wrinkles out of clothes. Stoves and ovens use heat to cook, and heaters warm our water."},
    {q:"Traffic lights use light to...",
     o:["Give signals","Cook food","Warm water","Iron clothes"],
     a:0, why:"Traffic lights give signals so that drivers and people walking know when to stop and when to go."},
    {q:"In Grenada, which fuel is used in cars and motorcycles?",
     o:["Gasoline, or petrol","Charcoal","Firewood","LPG cooking gas"],
     a:0, why:"Gasoline (petrol) is used in cars and motorcycles."},
    {q:"Which fuel is used in buses, trucks and boats?",
     o:["Diesel","Firewood","Charcoal","LPG cooking gas"],
     a:0, why:"Diesel powers buses, trucks and boats. It is also used to run machines and generators."},
    {q:"What is heat?",
     o:["A form of energy that makes things warmer","A kind of light","A type of fuel","A cold wind"],
     a:0, why:"Heat is a form of energy. It makes things warmer and can change materials: ice melts and chocolate melts when they are heated."},
    {q:"Light cannot pass through a wooden door. The door is...",
     o:["Opaque","Transparent","Reflective","Melted"],
     a:0, why:"Light being blocked means opaque. Light passing through means transparent. Light bouncing off, like off a mirror, means reflective."},
    {q:"Our new unit is called Waves, Light and ___ .",
     o:["Sound","Water","Colour","Shadows"],
     a:0, why:"The new unit is Waves, Light and Sound. We will learn what a wave is, how vibrations make sound, and how different materials sound different."},
    {q:"What does a wave carry from one place to another?",
     o:["Energy","Water","Air","Light bulbs"],
     a:0, why:"A wave moves energy from one place to another."},
    {q:"Sound is made when something...",
     o:["Vibrates","Melts","Freezes","Reflects"],
     a:0, why:"Vibrations make sound. When something vibrates, it shakes back and forth very quickly, and that makes a sound."},
    {q:"Do all materials make the SAME sound when they vibrate?",
     o:["No, different materials make different sounds","Yes, every material sounds the same","Only metals make sound","Only wood makes sound"],
     a:0, why:"Different materials vibrate in different ways, so they make different sounds. We will investigate this with vibrating materials."}
  ]
},
{
  id:"math", name:"Math", topic:"Place value, rounding and patterns", color:"var(--math)", icon:"ic-math",
  q:[
    {q:"What is the place value of the 5 in 352?",
     o:["5 tens, which is 50","5 ones, which is 5","5 hundreds, which is 500","5 thousands, which is 5,000"],
     a:0, why:"Place value depends on where the digit sits. The 5 in 352 is in the tens place, so it is worth 50."},
    {q:"What is the FACE value of the 7 in 573?",
     o:["7","70","700","3"],
     a:0, why:"Face value is just the digit itself, no matter where it sits in the number. So the face value of 7 is 7."},
    {q:"Which one shows 4,582 in expanded notation?",
     o:["4,000 + 500 + 80 + 2","4 + 5 + 8 + 2","400 + 50 + 8 + 2","4,000 + 50 + 8 + 2"],
     a:0, why:"Expanded notation shows the value of each digit on its own, added together: 4,000 + 500 + 80 + 2."},
    {q:"Which sign means greater than?",
     o:["&gt;","&lt;","=","+"],
     a:0, why:"&gt; means greater than, &lt; means less than, and = means equal to."},
    {q:"Which sign goes in the box?   462 [ ] 426",
     o:["&gt;","&lt;","=","+"],
     a:0, why:"462 is bigger than 426, because 6 tens is more than 2 tens. So 462 &gt; 426."},
    {q:"How do you write 614 in words?",
     o:["Six hundred and fourteen","Six hundred and forty","Six hundred and forty-one","Sixty-one and four"],
     a:0, why:"614 has 6 hundreds, 1 ten and 4 ones, so we write six hundred and fourteen."},
    {q:"Which number is the largest?",
     o:["980","908","899","890"],
     a:0, why:"Three of them have 9 hundreds, so look at the tens next. 980 has 8 tens, which is the most."},
    {q:"Ms. Tonya is standing 3rd in the line. How do we write 3rd in words?",
     o:["Third","Three","Thirty","Thirteenth"],
     a:0, why:"Ordinal numbers tell us position: 1st first, 2nd second, 3rd third, 4th fourth, 5th fifth."},
    {q:"Round 24 to the nearest ten.",
     o:["20","30","24","100"],
     a:0, why:"Underline the tens digit (2) and circle the digit behind it (4). Because 4 is 1, 2, 3 or 4, you round DOWN: 24 becomes 20."},
    {q:"Round 76 to the nearest ten.",
     o:["80","70","76","100"],
     a:0, why:"Circle the 6. Because 6 is 5, 6, 7, 8 or 9, you round UP: add one to the 7 and turn the 6 into a zero, so 76 becomes 80."},
    {q:"Round 341 to the nearest hundred.",
     o:["300","400","340","350"],
     a:0, why:"Underline the hundreds digit (3) and circle the 4. Because 4 is less than 5, you round DOWN: 341 becomes 300."},
    {q:"When the circled number is 5, 6, 7, 8 or 9, you...",
     o:["Round up","Round down","Leave it the same","Start the number again"],
     a:0, why:"5, 6, 7, 8 and 9 round UP. 1, 2, 3 and 4 round DOWN."},
    {q:"Ascending order means arranging numbers from...",
     o:["Smallest to largest","Largest to smallest","Odd to even","Longest to shortest"],

    {q:"Which list is in DESCENDING order?",

/* ---------- sound ---------- */
var actx=null;
function tone(freq, start, dur, type, vol){
  var o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0, actx.currentTime+start);
  g.gain.linearRampToValueAtTime(vol, actx.currentTime+start+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+start+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(actx.currentTime+start); o.stop(actx.currentTime+start+dur+0.02);
}
function sfx(kind){
  if(!soundOn) return;
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    if(kind==="ok"){ tone(659,0,.16,"triangle",.16); tone(988,.1,.26,"triangle",.14); }
    else if(kind==="no"){ tone(196,0,.22,"sine",.13); }
    else { [523,659,784,1047].forEach(function(f,i){ tone(f,i*0.1,.3,"triangle",.14); }); }
  }catch(e){}
}

/* ---------- confetti ---------- */
var cv=document.getElementById("fx"), cx=cv.getContext("2d"), bits=[], raf=null;
var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function sizeCanvas(){ var r=Math.min(window.devicePixelRatio||1,2); cv.width=innerWidth*r; cv.height=innerHeight*r; cx.setTransform(r,0,0,r,0,0); }
sizeCanvas(); addEventListener("resize", sizeCanvas);
function burst(n, cols){
  if(reduce) return;
  for(var i=0;i<n;i++){
    bits.push({x:innerWidth*(.2+Math.random()*.6), y:innerHeight*.35+Math.random()*60,
      vx:(Math.random()-.5)*8, vy:-6-Math.random()*7,
      s:5+Math.random()*7, r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3,
      c:cols[i%cols.length], life:90+Math.random()*40});
  }
  if(!raf) raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  for(var i=bits.length-1;i>=0;i--){
    var b=bits[i];
    b.vy+=0.28; b.x+=b.vx; b.y+=b.vy; b.r+=b.vr; b.life--;
    if(b.life<=0 || b.y>innerHeight+40){ bits.splice(i,1); continue; }
    cx.save(); cx.translate(b.x,b.y); cx.rotate(b.r); cx.fillStyle=b.c;
    cx.fillRect(-b.s/2,-b.s/2,b.s,b.s*0.6); cx.restore();
  }
  if(bits.length) raf=requestAnimationFrame(tick);
  else { raf=null; cx.clearRect(0,0,innerWidth,innerHeight); }
}

var app=document.getElementById("app");
function svg(id, cls){ return '<svg'+(cls?' class="'+cls+'"':'')+' aria-hidden="true"><use href="#'+id+'" xlink:href="#'+id+'"></use></svg>'; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* ---------- state ---------- */
var S=null, order=[], qi=0, score=0, locked=false, optIdx=[];

/* ---------- menu ---------- */
function renderMenu(){
  var cards = SUBJECTS.map(function(s){
    var b = best[s.id];
    return '<button class="card" style="--c:'+s.color+'" data-go="'+s.id+'">'+
      '<span class="ic">'+svg(s.icon)+'</span>'+
      '<span class="name">'+s.name+'</span>'+
      '<p class="meta">'+s.topic+'<br>'+s.q.length+' questions</p>'+
      (b!==undefined ? '<span class="best">'+svg("ic-star")+'Best: '+b+' / '+s.q.length+'</span>' : '')+
    '</button>';
  }).join("");

  app.innerHTML =
    '<p class="eyebrow">Grade 3 &middot; Term 1</p>'+
    '<h1>Quiz <span class="pop">Quest</span></h1>'+
    '<p class="sub">Pick a subject and collect stars. Every question comes straight from your own class notes, so this is real practice.</p>'+
    '<div class="grid">'+cards+'</div>'+
    '<div class="tipbar"><span><b>New this week:</b> Fractions, and sound in Science.<br>Spelling still has the silent k and silent b words to practise.</span>'+
      '<button class="ghost" data-snd>Sound: '+(soundOn?"on":"off")+'</button></div>';
  scrollTo(0,0);
}

/* ---------- quiz ---------- */
function startQuiz(id){
  S = SUBJECTS.filter(function(s){ return s.id===id; })[0];
  order = shuffle(S.q.map(function(_,i){ return i; }));
  qi=0; score=0;
  renderQuestion();
}

function renderQuestion(){
  locked=false;
  var q = S.q[order[qi]];
  optIdx = shuffle(q.o.map(function(_,i){ return i; }));
  var letters="ABCD";
  var opts = optIdx.map(function(orig,pos){
    return '<button class="opt" data-pick="'+pos+'"><span class="ltr">'+letters[pos]+'</span>'+
           '<span class="txt">'+q.o[orig]+'</span><span class="mark">'+svg("ic-check")+'</span></button>';
  }).join("");

  app.innerHTML =
    '<div style="--c:'+S.color+'">'+
      '<div class="topbar">'+
        '<button class="ghost" data-menu>&larr; Menu</button>'+
        '<span class="title">'+S.name+'</span>'+
        '<span class="pill">'+svg("ic-star")+'<span>'+score+'</span></span>'+
      '</div>'+
      '<div class="track"><i style="width:'+(qi/S.q.length*100)+'%"></i></div>'+
      '<p class="count">QUESTION '+(qi+1)+' OF '+S.q.length+'</p>'+
      '<div class="qcard">'+
        '<h2 class="qtext">'+q.q+'</h2>'+
        '<div class="opts">'+opts+'</div>'+
        '<div id="fbslot" aria-live="polite"></div>'+
      '</div>'+
    '</div>';
  scrollTo(0,0);
}

function pick(pos){
  if(locked) return;
  locked=true;
  var q = S.q[order[qi]];
  var right = optIdx[pos]===q.a;
  var nodes = app.querySelectorAll(".opt");
  for(var i=0;i<nodes.length;i++){
    nodes[i].disabled = true;
    if(optIdx[i]===q.a){ nodes[i].classList.add("right"); nodes[i].querySelector(".mark").innerHTML=svg("ic-check"); }
    else if(i===pos){ nodes[i].classList.add("wrong"); nodes[i].querySelector(".mark").innerHTML=svg("ic-x"); }
    else nodes[i].classList.add("dim");
  }
  if(right){ score++; sfx("ok"); burst(26, PARTY); }
  else sfx("no");

  var head = right
    ? ["Yes! Nailed it.","Correct! Well done.","That is right!","Exactly right!"][Math.floor(Math.random()*4)]
    : "Not this time - the answer is " + q.o[q.a];
  app.querySelector(".pill span").textContent = score;
  app.querySelector(".track i").style.width = ((qi+1)/S.q.length*100)+"%";
  app.querySelector("#fbslot").innerHTML =
    '<div class="fb '+(right?"ok":"no")+'"><h3>'+head+'</h3><p>'+q.why+'</p></div>'+
    '<button class="big" data-next>'+(qi+1<S.q.length ? "Next question &rarr;" : "See my score &rarr;")+'</button>';
}

function next(){
  qi++;
  if(qi < S.q.length) renderQuestion();
  else renderResult();
}

function renderResult(){
  var total=S.q.length, pct=Math.round(score/total*100);
  var stars = pct>=90?3 : pct>=70?2 : pct>=50?1 : 0;
  if(best[S.id]===undefined || score>best[S.id]){ best[S.id]=score; saveBest(best); }

  var msg;
  if(stars===3) msg="You have really learned this. Three stars is the top score.";
  else if(stars===2) msg="Strong work. Read the blue notes on the ones you missed and try for three stars.";
  else if(stars===1) msg="Good start. Go through it once more - the explanations tell you exactly why.";
  else msg="This one is still new. Try it again and read each explanation carefully. You will get there.";

  var starRow="";
  for(var i=0;i<3;i++) starRow += svg("ic-star", i<stars ? "lit" : "");

  if(stars>=2){ sfx("win"); burst(70, PARTY); }

  app.innerHTML =
    '<div style="--c:'+S.color+'">'+
      '<div class="topbar"><button class="ghost" data-menu>&larr; Menu</button>'+
        '<span class="title">'+S.name+' &middot; finished</span></div>'+
      '<div class="qcard result">'+
        '<div class="ring" style="--pct:'+pct+'"><div class="inner">'+
          '<span class="num">'+score+'</span><span class="of">out of '+total+'</span></div></div>'+
        '<div class="stars">'+starRow+'</div>'+
        '<h2>'+(stars===3?"Perfect run!":stars===2?"Nicely done!":stars===1?"Keep going!":"Let us try again")+'</h2>'+
        '<p class="msg">'+msg+'</p>'+
        '<div class="row">'+
          '<button class="big" data-again>Try this one again</button>'+
          '<button class="big alt" data-menu>Pick another subject</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  scrollTo(0,0);
}

/* ---------- events ---------- */
app.addEventListener("click", function(e){
  var t = e.target.closest("button");
  if(!t) return;
  if(t.dataset.go)            startQuiz(t.dataset.go);
  else if(t.dataset.menu!==undefined)  renderMenu();
  else if(t.dataset.pick!==undefined)  pick(+t.dataset.pick);
  else if(t.dataset.next!==undefined)  next();
  else if(t.dataset.again!==undefined) startQuiz(S.id);
  else if(t.dataset.snd!==undefined){
    soundOn=!soundOn;
    try{ localStorage.setItem(SND_KEY, soundOn?"on":"off"); }catch(err){}
    t.textContent="Sound: "+(soundOn?"on":"off");
    if(soundOn) sfx("ok");
  }
});

renderMenu();
</script>
</body>
</html>
