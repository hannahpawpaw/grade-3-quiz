<style>
html,body{margin:0}

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --paper:#EEF5FF;
  --paper2:#FFFFFF;
  --card:#FFFFFF;
  --ink:#1B2B49;
  --ink-soft:#5B6E90;
  --line:#D5E2F6;
  --shadow:rgba(27,43,73,.13);
  --sci:#00A28C;
  --math:#F4761B;
  --eng:#7A4DFF;
  --soc:#DD3F7C;
  --spell:#2B72D8;
  --christ:#B5821A;
  --frac:#2E9E5B;
  --sound:#D63A2F;
  --carib:#0E7C9E;
  --times:#A32FB5;
  --symbols:#7A9E1F;
  --memory:#C9811B;
  --good:#0E9D53;
  --good-bg:#E0F7EA;
  --oops:#D64550;
  --oops-bg:#FDE9EA;
  --gold:#F0A415;
  --star-off:#C9D7EC;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101829;
    --paper2:#18223A;
    --card:#1B2740;
    --ink:#E9F1FF;
    --ink-soft:#9DAFD0;
    --line:#2E3E60;
    --shadow:rgba(0,0,0,.45);
    --sci:#34DFC2;
    --math:#FFA04D;
    --eng:#AE92FF;
    --soc:#FF75A8;
    --spell:#79B6FF;
    --christ:#F0C368;
    --frac:#5FD98A;
    --sound:#FF8A80;
    --carib:#5AC8E8;
    --times:#DE8CF0;
    --symbols:#C3DB72;
    --memory:#F3C889;
    --good:#45D98C;
    --good-bg:#10341F;
    --oops:#FF8A90;
    --oops-bg:#3A1C22;
    --gold:#FFC862;
    --star-off:#36456A;
  }
}
:root[data-theme="dark"]{
  --paper:#101829;
  --paper2:#18223A;
  --card:#1B2740;
  --ink:#E9F1FF;
  --ink-soft:#9DAFD0;
  --line:#2E3E60;
  --shadow:rgba(0,0,0,.45);
  --sci:#34DFC2;
  --math:#FFA04D;
  --eng:#AE92FF;
  --soc:#FF75A8;
  --spell:#79B6FF;
  --christ:#F0C368;
  --frac:#5FD98A;
  --sound:#FF8A80;
  --carib:#5AC8E8;
  --times:#DE8CF0;
  --symbols:#C3DB72;
  --memory:#F3C889;
  --good:#45D98C;
  --good-bg:#10341F;
  --oops:#FF8A90;
  --oops-bg:#3A1C22;
  --gold:#FFC862;
  --star-off:#36456A;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  background-image:
    radial-gradient(60vw 40vw at 8% -5%, color-mix(in srgb, var(--eng) 16%, transparent), transparent 70%),
    radial-gradient(55vw 40vw at 100% 8%, color-mix(in srgb, var(--sci) 16%, transparent), transparent 70%),
    radial-gradient(70vw 45vw at 50% 105%, color-mix(in srgb, var(--math) 13%, transparent), transparent 70%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"Andika","Verdana",system-ui,sans-serif;
  font-size:17px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,.disp{font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;font-weight:600;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--eng);outline-offset:3px;border-radius:8px}

.wrap{max-width:760px;margin:0 auto;padding-inline:18px;padding-block:26px 56px}

/* ---------- home ---------- */
.eyebrow{
  font-family:"Fredoka","Trebuchet MS",sans-serif;
  font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-soft);margin:0 0 10px
}
h1{font-size:clamp(2.3rem,9vw,3.4rem);line-height:1.02;font-weight:700;letter-spacing:-.01em}
h1 .pop{color:var(--math)}
.sub{color:var(--ink-soft);margin:12px 0 0;max-width:46ch}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:28px}
.group{margin-top:30px}
.group .grid{margin-top:0}
.grouphead{
  font-family:"Fredoka","Trebuchet MS",sans-serif;font-size:.78rem;font-weight:600;
  letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);
  margin:0 0 11px;padding-bottom:8px;border-bottom:2px solid var(--line)
}
.card:last-child:nth-child(odd){grid-column:1 / -1}
@media (max-width:540px){.grid{grid-template-columns:1fr}}

.card{
  --c:var(--sci);
  display:flex;flex-direction:column;gap:10px;align-items:flex-start;
  text-align:left;background:var(--card);
  border:2px solid var(--line);border-bottom-width:5px;
  border-radius:20px;padding:18px 18px 16px;
  box-shadow:0 5px 0 -2px var(--shadow);
  transition:transform .14s ease, border-color .14s ease;
}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--c)}
.card:active{transform:translateY(0)}
.ic{
  width:52px;height:52px;border-radius:15px;display:grid;place-items:center;
  background:rgba(125,125,125,.16);
  background:color-mix(in srgb, var(--c) 17%, transparent);color:var(--c)
}
.ic svg{width:29px;height:29px}
.card .name{font-family:"Fredoka",sans-serif;font-size:1.32rem;font-weight:600;line-height:1.1}
.card .meta{font-size:.86rem;color:var(--ink-soft);margin:0}
.best{
  display:inline-flex;align-items:center;gap:5px;margin-top:2px;
  font-size:.8rem;font-weight:700;color:var(--gold)
}
.best svg{width:15px;height:15px}

.tipbar{
  display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;
  margin-top:26px;padding:14px 16px;border-radius:16px;
  background:var(--paper2);border:2px dashed var(--line);
  font-size:.88rem;color:var(--ink-soft)
}
.ghost{
  background:transparent;border:2px solid var(--line);border-radius:999px;
  padding:7px 14px;font-family:"Fredoka",sans-serif;font-size:.85rem;color:var(--ink)
}
.ghost:hover{border-color:var(--ink-soft)}

/* ---------- quiz ---------- */
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar .title{font-family:"Fredoka",sans-serif;font-size:1.15rem;font-weight:600;flex:1;min-width:120px}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--card);border:2px solid var(--line);border-radius:999px;
  padding:5px 13px;font-family:"Fredoka",sans-serif;font-size:.9rem;font-weight:600
}
.pill svg{width:16px;height:16px;color:var(--gold)}

.track{height:14px;border-radius:999px;background:var(--line);margin:18px 0 6px;overflow:hidden}
.track i{display:block;height:100%;border-radius:999px;background:var(--c,var(--sci));transition:width .35s cubic-bezier(.3,1.4,.5,1)}
.count{font-size:.83rem;color:var(--ink-soft);margin:0 0 18px;font-weight:700;letter-spacing:.04em}

.qcard{
  background:var(--card);border:2px solid var(--line);border-bottom-width:5px;
  border-radius:22px;padding:22px 20px;box-shadow:0 5px 0 -2px var(--shadow)
}
.qtext{font-size:clamp(1.3rem,4.6vw,1.72rem);line-height:1.25;font-weight:600}

.opts{display:flex;flex-direction:column;gap:11px;margin-top:20px}
.opt{
  display:flex;align-items:center;gap:13px;text-align:left;width:100%;
  min-height:62px;padding:12px 15px;
  background:var(--paper2);border:2px solid var(--line);border-radius:16px;
  font-size:1.02rem;line-height:1.35;
  transition:border-color .12s ease, background .12s ease, transform .12s ease
}
.opt:hover:not(:disabled){border-color:var(--c);transform:translateX(3px)}
.opt:disabled{cursor:default}
.opt .ltr{
  flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  background:rgba(125,125,125,.16);
  background:color-mix(in srgb, var(--c) 16%, transparent);color:var(--c);
  font-family:"Fredoka",sans-serif;font-weight:600
}
.opt .mark{flex:none;width:24px;height:24px;margin-left:auto;display:none}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .ltr{background:var(--good);color:#fff}
.opt.right .mark{display:block;color:var(--good)}
.opt.wrong{border-color:var(--oops);background:var(--oops-bg)}
.opt.wrong .ltr{background:var(--oops);color:#fff}
.opt.wrong .mark{display:block;color:var(--oops)}
.opt.dim{opacity:.5}

.fb{
  margin-top:18px;padding:15px 16px;border-radius:16px;border:2px solid;
  animation:pop .28s cubic-bezier(.3,1.5,.5,1)
}
.fb.ok{background:var(--good-bg);border-color:var(--good)}
.fb.no{background:var(--oops-bg);border-color:var(--oops)}
.fb h3{font-size:1.1rem;margin-bottom:4px}
.fb.ok h3{color:var(--good)}
.fb.no h3{color:var(--oops)}
.fb p{margin:0;font-size:.95rem}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.big{
  display:block;width:100%;margin-top:18px;
  background:var(--c,var(--sci));color:#fff;border:none;border-radius:16px;
  padding:16px;font-family:"Fredoka",sans-serif;font-size:1.1rem;font-weight:600;
  box-shadow:0 4px 0 rgba(0,0,0,.3);
  box-shadow:0 4px 0 color-mix(in srgb, var(--c,var(--sci)) 65%, #000)
}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3);box-shadow:0 1px 0 color-mix(in srgb, var(--c,var(--sci)) 65%, #000)}

/* ---------- results ---------- */
.result{text-align:center;padding:30px 20px 26px}
.ring{
  width:168px;height:168px;margin:6px auto 4px;border-radius:50%;
  display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--pct)*1%), var(--line) 0);
}
.ring .inner{
  width:132px;height:132px;border-radius:50%;background:var(--card);
  display:grid;place-items:center;align-content:center
}
.ring .num{font-family:"Fredoka",sans-serif;font-size:2.6rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ring .of{font-size:.82rem;color:var(--ink-soft)}
.stars{display:flex;justify-content:center;gap:8px;margin:16px 0 10px}
.stars svg{width:42px;height:42px;color:var(--star-off)}
.stars svg.lit{color:var(--gold);animation:bounce .5s cubic-bezier(.3,1.6,.5,1) backwards}
.stars svg.lit:nth-child(2){animation-delay:.12s}
.stars svg.lit:nth-child(3){animation-delay:.24s}
@keyframes bounce{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.result h2{font-size:1.6rem}
.result .msg{color:var(--ink-soft);margin:8px auto 0;max-width:34ch}
.row{display:flex;gap:11px;margin-top:22px;flex-wrap:wrap}
.row>*{flex:1 1 160px}
.big.alt{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 -1px var(--shadow)}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

<script>
"use strict";

var SUBJECTS = [
{
  id:"sci", group:"Science", name:"Science", topic:"Light, heat and fuels", color:"var(--sci)", icon:"ic-sci",
  q:[
    {q:"What is a light source?",
     o:["Something that makes its own light","Something that is very shiny","Something that feels hot","Something that blocks light"],
     a:0, why:"A light source produces its own light. Things that only bounce light back, like the Moon, are not light sources."},
    {q:"Which one is a NATURAL light source?",
     o:["The Sun","A flashlight","A lamp","A candle"],
     a:0, why:"Natural light sources happen in nature: the Sun, stars and fire. Candles, lamps and flashlights are made by people."},
    {q:"Which one is made by people, not found in nature?",
     o:["A candle","The Sun","The stars","Fire"],
     a:0, why:"Human-made light sources are created by people: a candle, a lamp or a flashlight. The Sun, stars and fire are natural."},
    {q:"Why is the Moon NOT a light source?",
     o:["It only reflects light from the Sun","It is too far away from us","It only comes out at night","It is smaller than the Sun"],
     a:0, why:"The Moon does not make its own light. It reflects the Sun's light, so it is not a light source."},
    {q:"The Sun is Earth's main source of...",
     o:["Heat and light","Water and air","Food and sleep","Wind and rain"],
     a:0, why:"The Sun gives Earth the heat and light we need. Its energy also helps plants grow."},
    {q:"What would Earth be like without the Sun?",
     o:["Very cold and dark","Very noisy","Much faster","Exactly the same"],
     a:0, why:"Without the Sun, Earth would be very cold and dark, and most living things could not survive."},
    {q:"Which one of these uses HEAT?",
     o:["An iron","A mirror","A window","A pair of glasses"],
     a:0, why:"An iron uses heat to take the wrinkles out of clothes. Stoves and ovens use heat to cook, and heaters warm our water."},
    {q:"Traffic lights use light to...",
     o:["Give signals","Cook food","Warm water","Iron clothes"],
     a:0, why:"Traffic lights give signals so that drivers and people walking know when to stop and when to go."},
    {q:"In Grenada, which fuel is used in cars and motorcycles?",
     o:["Gasoline, or petrol","Charcoal","Firewood","LPG cooking gas"],
     a:0, why:"Gasoline (petrol) is used in cars and motorcycles."},
    {q:"Which fuel is used in buses, trucks and boats?",
     o:["Diesel","Firewood","Charcoal","LPG cooking gas"],
     a:0, why:"Diesel powers buses, trucks and boats. It is also used to run machines and generators."},
    {q:"What is heat?",
     o:["A form of energy that makes things warmer","A kind of light","A type of fuel","A cold wind"],
     a:0, why:"Heat is a form of energy. It makes things warmer and can change materials: ice melts and chocolate melts when they are heated."},
    {q:"Light cannot pass through a wooden door. The door is...",
     o:["Opaque","Transparent","Reflective","Melted"],
     a:0, why:"Light being blocked means opaque. Light passing through means transparent. Light bouncing off, like off a mirror, means reflective."}
  ]
},
{
  id:"sound", group:"Science", name:"Sound", topic:"Waves, vibrations and pitch", color:"var(--sound)", icon:"ic-sound",
  q:[
    {q:"What is a wave?",
     o:["A movement that carries energy from one place to another","A big splash in the sea","A kind of loud noise","A piece of string that shakes"],
     a:0, why:"A wave is a movement that carries energy from one place to another. Waves can travel through air, water and other materials."},
    {q:"What do waves carry from one place to another?",
     o:["Energy","Water","Air","Light bulbs"],
     a:0, why:"Waves carry energy. Some waves can be seen and some can be heard."},
    {q:"When you throw a stone into water, what spreads across the water?",
     o:["Ripples","Bubbles","Sand","Steam"],
     a:0, why:"Ripples spread across the water. That is a wave moving energy from one place to another."},
    {q:"What is sound?",
     o:["A type of energy that we can hear","A type of light that we can see","A kind of material","A sort of wind"],
     a:0, why:"Sound is a type of energy that we can hear. It is made when an object vibrates."},
    {q:"Sound is made when an object...",
     o:["Vibrates","Melts","Freezes","Reflects light"],
     a:0, why:"Sound is made when an object vibrates. A drum skin vibrates, a guitar string vibrates, and your vocal cords vibrate when you speak."},
    {q:"What is a vibration?",
     o:["A quick back and forth movement","A slow melting","A bright flash","A loud shout"],
     a:0, why:"A vibration is a quick back and forth movement."},
    {q:"What happens to the sound when the vibrations STOP?",
     o:["The sound stops too","The sound gets louder","The sound gets higher","Nothing changes"],
     a:0, why:"When vibrations stop, the sound also stops."},
    {q:"Sound waves can travel through...",
     o:["Air, liquids and solids","Only air","Only water","Nothing at all"],
     a:0, why:"Sound travels as waves, and sound waves can travel through the air, through a liquid and even through a solid."},
    {q:"You can hear whales and dolphins underwater. This shows that sound can travel through...",
     o:["A liquid","A solid","Empty space","Only air"],
     a:0, why:"Hearing whales and dolphins underwater shows sound travelling through a liquid."},
    {q:"You can hear someone knocking on a door. This shows that sound can travel through...",
     o:["A solid","A liquid","Empty space","Only air"],
     a:0, why:"Hearing a knock through a door shows sound travelling through a solid."},
    {q:"Which material can produce a RINGING sound?",
     o:["Metal","Wood","Rubber","Paper"],
     a:0, why:"Metal can produce ringing sounds. Wood produces tapping or knocking sounds, and plastic produces tapping or clicking sounds."},
    {q:"Wood usually produces what kind of sound?",
     o:["Tapping or knocking sounds","Ringing sounds","Whistling sounds","No sound at all"],
     a:0, why:"Wood produces tapping or knocking sounds, because of the way it vibrates."},
    {q:"If you hit a drum HARDER, the sound becomes...",
     o:["Louder","Softer","Higher","Slower"],
     a:0, why:"Hitting a drum gently produces a softer sound. Hitting it harder produces a louder sound."},
    {q:"FAST vibrations produce a sound that is...",
     o:["Higher-pitched","Lower-pitched","Softer","Silent"],
     a:0, why:"Fast vibrations produce a higher-pitched sound. Slow vibrations produce a lower-pitched sound."},
    {q:"SLOW vibrations produce a sound that is...",
     o:["Lower-pitched","Higher-pitched","Louder","Silent"],
     a:0, why:"Slow vibrations produce a lower-pitched sound. Fast vibrations produce a higher-pitched sound."},
    {q:"Why do different materials make different sounds?",
     o:["Because they vibrate in different ways","Because they are different colours","Because they are different sizes only","Because some have no energy"],
     a:0, why:"Different materials vibrate in different ways, and that changes the sound they produce. Some materials vibrate easily and others do not."}
  ]
},
{
  id:"math", group:"Maths", name:"Math", topic:"Place value, rounding and patterns", color:"var(--math)", icon:"ic-math",
  q:[
    {q:"What is the place value of the 5 in 352?",
     o:["5 tens, which is 50","5 ones, which is 5","5 hundreds, which is 500","5 thousands, which is 5,000"],
     a:0, why:"Place value depends on where the digit sits. The 5 in 352 is in the tens place, so it is worth 50."},
    {q:"What is the FACE value of the 7 in 573?",
     o:["7","70","700","3"],
     a:0, why:"Face value is just the digit itself, no matter where it sits in the number. So the face value of 7 is 7."},
    {q:"Which one shows 4,582 in expanded notation?",
     o:["4,000 + 500 + 80 + 2","4 + 5 + 8 + 2","400 + 50 + 8 + 2","4,000 + 50 + 8 + 2"],
     a:0, why:"Expanded notation shows the value of each digit on its own, added together: 4,000 + 500 + 80 + 2."},
    {q:"Which sign means greater than?",
     o:["&gt;","&lt;","=","+"],
     a:0, why:"&gt; means greater than, &lt; means less than, and = means equal to."},
    {q:"Which sign goes in the box?   462 [ ] 426",
     o:["&gt;","&lt;","=","+"],
     a:0, why:"462 is bigger than 426, because 6 tens is more than 2 tens. So 462 &gt; 426."},
    {q:"How do you write 614 in words?",
     o:["Six hundred and fourteen","Six hundred and forty","Six hundred and forty-one","Sixty-one and four"],
     a:0, why:"614 has 6 hundreds, 1 ten and 4 ones, so we write six hundred and fourteen."},
    {q:"Which number is the largest?",
     o:["980","908","899","890"],
     a:0, why:"Three of them have 9 hundreds, so look at the tens next. 980 has 8 tens, which is the most."},
    {q:"Ms. Tonya is standing 3rd in the line. How do we write 3rd in words?",
     o:["Third","Three","Thirty","Thirteenth"],
     a:0, why:"Ordinal numbers tell us position: 1st first, 2nd second, 3rd third, 4th fourth, 5th fifth."},
    {q:"Round 24 to the nearest ten.",
     o:["20","30","24","100"],
     a:0, why:"Underline the tens digit (2) and circle the digit behind it (4). Because 4 is 1, 2, 3 or 4, you round DOWN: 24 becomes 20."},
    {q:"Round 76 to the nearest ten.",
     o:["80","70","76","100"],
     a:0, why:"Circle the 6. Because 6 is 5, 6, 7, 8 or 9, you round UP: add one to the 7 and turn the 6 into a zero, so 76 becomes 80."},
    {q:"Round 341 to the nearest hundred.",
     o:["300","400","340","350"],
     a:0, why:"Underline the hundreds digit (3) and circle the 4. Because 4 is less than 5, you round DOWN: 341 becomes 300."},
    {q:"When the circled number is 5, 6, 7, 8 or 9, you...",
     o:["Round up","Round down","Leave it the same","Start the number again"],
     a:0, why:"5, 6, 7, 8 and 9 round UP. 1, 2, 3 and 4 round DOWN."},
    {q:"Ascending order means arranging numbers from...",
     o:["Smallest to largest","Largest to smallest","Odd to even","Longest to shortest"],
     a:0, why:"Ascending means going up: 245, 378, 512, 690. Descending means going down."},
    {q:"Which list is in DESCENDING order?",
     o:["690, 512, 378, 245","245, 378, 512, 690","245, 690, 378, 512","378, 245, 690, 512"],
     a:0, why:"Descending order goes from largest to smallest: 690, 512, 378, 245."},
    {q:"Complete the sequence:   21, 23, 25, ___",
     o:["27","26","28","30"],
     a:0, why:"This pattern adds 2 each time, so after 25 comes 27."},
    {q:"Complete the sequence:   5, 10, ___, 20",
     o:["15","12","16","25"],
     a:0, why:"This pattern counts in fives: 5, 10, 15, 20."},
    {q:"Complete the sequence:   200, 150, 100, ___",
     o:["50","125","75","0"],
     a:0, why:"This pattern goes DOWN by 50 each time: 200, 150, 100, 50."},
    {q:"Complete the pattern:   2a, 4b, 6c, 8d, ___",
     o:["10e","9e","10d","12e"],
     a:0, why:"The numbers go up by 2 (2, 4, 6, 8, 10) and the letters follow in order (a, b, c, d, e), so the answer is 10e."}
  ]
},
{
  id:"frac", group:"Maths", name:"Fractions", topic:"Proportional reasoning", color:"var(--frac)", icon:"ic-frac",
  q:[
    {q:"What is a fraction?",
     o:["An equal part of a whole","A number bigger than 100","A way of adding numbers","A number with no value"],
     a:0, why:"A fraction is an equal part of a whole."},
    {q:"In a fraction, what is the NUMERATOR?",
     o:["The top number, which shows the amount we are counting","The bottom number","The line in the middle","The answer"],
     a:0, why:"The numerator is the upper number. It shows the considered or shaded amount."},
    {q:"In a fraction, what is the DENOMINATOR?",
     o:["The bottom number, which shows how many pieces the whole is cut into","The top number","The line in the middle","The whole number in front"],
     a:0, why:"The denominator is the lower number. It shows the total number of pieces the whole is cut into."},
    {q:"What is the FRACTION BAR?",
     o:["The line that separates the two numbers","The top number","The bottom number","A bar of chocolate cut in half"],
     a:0, why:"The fraction bar is the line that separates the numerator and the denominator."},
    {q:"In the fraction 3/4, which number is the DENOMINATOR?",
     o:["4","3","7","1"],
     a:0, why:"In 3/4 the denominator is 4, the lower number. It tells you the whole was cut into 4 equal pieces."},
    {q:"In the fraction 3/4, which number is the NUMERATOR?",
     o:["3","4","34","1"],
     a:0, why:"In 3/4 the numerator is 3, the upper number. It tells you that 3 of the pieces are being counted."},
    {q:"What is a UNIT fraction?",
     o:["A fraction whose numerator is always one","A fraction whose numerator is always bigger","A fraction equal to one whole","A fraction with a whole number in front"],
     a:0, why:"A unit fraction always has 1 as its numerator, like 1/2, 1/3 or 1/5."},
    {q:"Which one is a UNIT fraction?",
     o:["1/5","3/5","5/5","7/2"],
     a:0, why:"1/5 is a unit fraction because its numerator is 1."},
    {q:"What is a PROPER fraction?",
     o:["Its numerator is smaller than its denominator","Its numerator is larger than its denominator","Its numerator equals its denominator","It has a whole number in front"],
     a:0, why:"In a proper fraction the numerator is always smaller than the denominator, like 2/7."},
    {q:"Which one is a PROPER fraction?",
     o:["2/7","9/4","6/6","3 1/2"],
     a:0, why:"2/7 is proper because 2 is smaller than 7. 9/4 is improper, 6/6 equals one whole, and 3 1/2 is a mixed number."},
    {q:"What is an IMPROPER fraction?",
     o:["Its numerator is larger than its denominator","Its numerator is smaller than its denominator","Its numerator is always one","It is written with words"],
     a:0, why:"In an improper fraction the numerator is always larger than the denominator, like 9/4."},
    {q:"Which one is an IMPROPER fraction?",
     o:["9/4","4/9","1/4","4/4"],
     a:0, why:"9/4 is improper because 9 is larger than 4."},
    {q:"A fraction whose numerator is the SAME as its denominator is equal to...",
     o:["One whole","Zero","One half","Two wholes"],
     a:0, why:"When the numerator and denominator are the same, like 5/5, the fraction is equal to 1 whole."},
    {q:"Which fraction is equal to ONE WHOLE?",
     o:["5/5","1/5","5/1","4/5"],
     a:0, why:"5/5 equals one whole, because the numerator and the denominator are the same."},
    {q:"What is a MIXED NUMBER fraction?",
     o:["A whole number and a fraction together","Two fractions added together","A fraction with 1 on top","A fraction turned upside down"],
     a:0, why:"A mixed number is made up of a whole number and a fraction, like 2 1/3."},
    {q:"Which one is a MIXED NUMBER?",
     o:["2 1/3","2/3","3/2","1/2"],
     a:0, why:"2 1/3 is a mixed number: the whole number 2 together with the fraction 1/3."},
    {q:"What are EQUIVALENT fractions?",
     o:["Fractions that look different but have the same value","Fractions that are always bigger than one","Fractions with one on top","Fractions written in words"],
     a:0, why:"Equivalent fractions have different numerators and denominators, but they represent the same value."},
    {q:"1/2 and 2/4 are an example of...",
     o:["Equivalent fractions","Improper fractions","Mixed numbers","Unit fractions only"],
     a:0, why:"1/2 and 2/4 look different but they are worth the same amount, so they are equivalent fractions."}
  ]
},
{
  id:"times", group:"Maths", name:"Times Tables", topic:"Multiplying by 1, 2, 3 and 4", color:"var(--times)", icon:"ic-times",
  q:[
    {q:"What does 3 &times; 4 mean?",
     o:["3 groups of 4","3 added to 4","4 take away 3","3 shared between 4"],
     a:0, why:"3 &times; 4 means 3 groups of 4, which is 4 + 4 + 4 = 12."},
    {q:"Multiplication is a quick way of doing...",
     o:["Repeated addition","Repeated subtraction","Counting backwards","Sharing equally"],
     a:0, why:"Multiplying is a fast way to add the same number again and again. 4 &times; 5 is the same as 5 + 5 + 5 + 5."},
    {q:"Does 4 &times; 2 give the same answer as 2 &times; 4?",
     o:["Yes, the order does not change the answer","No, they are always different","Only for even numbers","Only for small numbers"],
     a:0, why:"Both equal 8. You can multiply two numbers in either order and the answer stays the same."},
    {q:"Which one is the same as 4 + 4 + 4 + 4 + 4?",
     o:["5 &times; 4","4 &times; 4","5 + 4","4 &times; 10"],
     a:0, why:"There are five 4s added together, so it is 5 &times; 4 = 20."},
    {q:"1 &times; 8 = ?",
     o:["8","1","9","18"],
     a:0, why:"Any number multiplied by 1 stays the same, so 1 &times; 8 = 8."},
    {q:"2 &times; 5 = ?",
     o:["10","7","12","25"],
     a:0, why:"2 &times; 5 = 10. Counting in twos: 2, 4, 6, 8, 10."},
    {q:"2 &times; 7 = ?",
     o:["14","12","16","9"],
     a:0, why:"2 &times; 7 = 14. Double 7 is 14."},
    {q:"2 &times; 9 = ?",
     o:["18","16","20","11"],
     a:0, why:"2 &times; 9 = 18. Double 9 is 18."},
    {q:"2 &times; 12 = ?",
     o:["24","22","26","14"],
     a:0, why:"2 &times; 12 = 24. Double 12 is 24."},
    {q:"3 &times; 3 = ?",
     o:["9","6","12","33"],
     a:0, why:"3 &times; 3 = 9. Three groups of three: 3 + 3 + 3 = 9."},
    {q:"3 &times; 6 = ?",
     o:["18","15","21","24"],

    {q:"3 &times; 8 = ?",
     o:["24","21","27","18"],
     a:0, why:"3 &times; 8 = 24. Counting in threes to the eighth number: 3, 6, 9, 12, 15, 18, 21, 24."},
    {q:"3 &times; 9 = ?",
     o:["27","24","30","21"],
     a:0, why:"3 &times; 9 = 27."},
    {q:"3 &times; 12 = ?",
     o:["36","33","39","30"],
     a:0, why:"3 &times; 12 = 36."},
    {q:"4 &times; 4 = ?",
     o:["16","12","20","8"],
     a:0, why:"4 &times; 4 = 16. Four groups of four."},
    {q:"4 &times; 6 = ?",
     o:["24","20","28","18"],

    {q:"4 &times; 7 = ?",
     o:["28","24","32","21"],

    {q:"4 &times; 8 = ?",
     o:["32","28","36","24"],

    {q:"4 &times; 9 = ?",
     o:["36","32","40","27"],
     a:0, why:"4 &times; 9 = 36."},
    {q:"4 &times; 11 = ?",
     o:["44","40","48","41"],
     a:0, why:"4 &times; 11 = 44."},
    {q:"4 &times; 12 = ?",
     o:["48","44","52","36"],

    {q:"Find the missing number:   4 &times; ___ = 20",

     a:0, why:"4 bags &times; 3 mangoes = 12 mangoes."},
    {q:"A nutmeg tree has 4 branches with 9 nutmegs on each branch. How many nutmegs?",

     a:0, why:"4 branches &times; 9 nutmegs = 36 nutmegs."}
  ]
},
{
  id:"eng", group:"English", name:"English", topic:"Nouns, verbs and sentences", color:"var(--eng)", icon:"ic-eng",
  q:[
    {q:"What does the BEGINNING of a story do?",
     o:["Introduces the characters and tells what the story is about","Sorts out all the problems","Tells us the lesson that was learnt","Tells us what the characters do all day"],
     a:0, why:"Beginning: introduces the characters. Middle: what the characters do and the problems they have. End: problems get sorted out and lessons are learnt."},
    {q:"Where a story takes place is called the...",
     o:["Setting","Plot","Characters","Title"],
     a:0, why:"Setting is where. Characters are who. Plot is what happens."},
    {q:"Which one is a PROPER noun?",
     o:["Grenada","island","teacher","school"],
     a:0, why:"Proper nouns name a specific person, place or organisation, and they always begin with a capital letter, like Grenada, March, Friday and Ms. Tonya."},
    {q:"What is the plural of fox?",
     o:["foxes","foxs","foxies","fox"],
     a:0, why:"For nouns ending in s, sh, tch or x we add es: bus becomes buses, watch becomes watches, fox becomes foxes."},
    {q:"What is the plural of baby?",
     o:["babies","babys","babyes","baby"],
     a:0, why:"For nouns ending in y, change the y to i and add es: baby becomes babies, grocery becomes groceries, fly becomes flies."},
    {q:"What is the plural of knife?",
     o:["knives","knifes","knifees","knife"],
     a:0, why:"For nouns ending in f, change the f to v and add es: leaf becomes leaves, wolf becomes wolves, knife becomes knives. Knife is also one of your silent k spelling words."},
    {q:"What is the plural of mouse?",
     o:["mice","mouses","mices","mouse"],
     a:0, why:"Some nouns have special irregular plurals: man becomes men, woman becomes women, mouse becomes mice."},
    {q:"Which one is an ABSTRACT noun?",
     o:["happiness","garden","monkey","chocolate"],
     a:0, why:"Abstract nouns name feelings and ideas that we cannot see or touch, like trust, courage, anger, honesty, happiness and sadness."},
    {q:"Which sentence is written correctly?",
     o:["Ben plays football on Friday.","Ben play football on Friday.","Ben playing football on Friday.","Ben to play football on Friday."],
     a:0, why:"We add s to a present tense verb when we talk about one person, animal or thing: Ben plays football, and on Saturday he helps at home."},
    {q:"Finish the question:  ___ he play soccer?",
     o:["Does","Do","Done","Doing"],
     a:0, why:"Use does with he, she, it and one person or thing. Use do with I, you, we, they and plural nouns."},
    {q:"Which one is a STATEMENT, a telling sentence?",
     o:["Squids live in the sea.","Would you like to come to my party?","Happy birthday!","Ice-cream and cake on my birthday"],
     a:0, why:"A statement tells us something and ends with a full stop. A question ends with a question mark, and an exclamation mark shows strong feelings or shouting."},
    {q:"In a dictionary, which word comes first?",
     o:["play","poem","port","push"],
     a:0, why:"Dictionary words are in alphabetical order. These all start with p, so look at the second letter: l comes before o, r and u."},
    {q:"A group of birds is called a...",
     o:["flock","herd","swarm","bunch"],
     a:0, why:"Collective nouns name groups: a flock of birds, a herd of goats, a swarm of bees, a bunch of flowers and a class of children."}
  ]
},
{
  id:"spell8", group:"English", name:"Spelling: wa and qua", topic:"Week 8 &middot; test Friday 30th", color:"var(--spell)", icon:"ic-spell",
  q:[
    {q:"Which one is spelled correctly?",
     o:["wasp","wosp","whasp","wassp"],
     a:0, why:"Wasp is spelled with wa, even though the a sounds like o. A wasp is an insect that can sting."},
    {q:"Which one is spelled correctly?",
     o:["wander","wandar","wandre","wannder"],
     a:0, why:"Wander is spelled with wa. To wander is to walk about with no particular place to go. Do not mix it up with wonder, which means to think about something."},
    {q:"Which one is spelled correctly?",
     o:["wallet","walet","wollet","wallit"],
     a:0, why:"Wallet has wa and a double l. A wallet holds money and cards."},
    {q:"Which one is spelled correctly?",
     o:["swamp","swomp","swammp","swampe"],
     a:0, why:"Swamp is spelled with wa, even though it sounds like swomp. A swamp is soft, wet ground."},
    {q:"Which one is spelled correctly?",
     o:["quantity","quanity","quantety","quontity"],
     a:0, why:"Quantity begins with qua. Quantity means how much of something there is."},
    {q:"Which one is spelled correctly?",
     o:["quality","qualety","quolity","qualitty"],
     a:0, why:"Quality begins with qua. Quality means how good something is."},
    {q:"Which one is spelled correctly?",
     o:["squash","squosh","sqash","squashe"],
     a:0, why:"Squash has qua inside it, and the a sounds like o. Squash is a vegetable, and it also means to press something flat."},
    {q:"Which one is spelled correctly?",
     o:["afterward","afterwerd","aftward","afterwird"],
     a:0, why:"Afterward is spelled with wa, and here the ar sounds like the or in for. Afterward means later on."},
    {q:"In which group of words does the 'a' after w sound like 'o'?",
     o:["was, wash, want","war, warm, ward","wake, wave, wait","wing, win, with"],
     a:0, why:"In was, wash, want, watch, water, swan, swap and swamp the a after w sounds like o."},
    {q:"In words like war, warm and ward, the letters 'ar' after w sound like...",
     o:["or, as in for","ar, as in car","air, as in hair","ur, as in fur"],
     a:0, why:"After a w, ar usually sounds like or: war, ward, warn, warm, toward and afterward."},
    {q:"Which word means a fight between countries?",
     o:["war","ward","warn","warm"],
     a:0, why:"War is a fight between countries. Be careful, because war, ward, warn and warm all look very alike."},
    {q:"Which word means a room or section in a hospital?",
     o:["ward","war","warn","wander"],
     a:0, why:"A ward is a room or section in a hospital where patients are cared for."},
    {q:"Finish the sentence: Please ___ your hands before dinner.",
     o:["wash","watch","wasp","swap"],
     a:0, why:"To wash is to clean something with water. The a sounds like o."},
    {q:"Finish the sentence: The white ___ glided across the lake.",
     o:["swan","swap","swamp","wasp"],
     a:0, why:"A swan is a large white water bird. The a after w sounds like o."},
    {q:"Finish the sentence: I will ___ my apple for your orange.",
     o:["swap","swan","swamp","wasp"],
     a:0, why:"To swap is to trade one thing for another."},
    {q:"Finish the sentence: Put on a jumper to keep ___ .",
     o:["warm","warn","war","ward"],
     a:0, why:"Warm means a little bit hot. Remember the ar sounds like or."},
    {q:"Finish the sentence: The sign is there to ___ us about the cliff.",
     o:["warn","warm","war","ward"],
     a:0, why:"To warn is to tell someone about danger."},
    {q:"Finish the sentence: They walked ___ the beach.",
     o:["toward","afterward","wander","warn"],
     a:0, why:"Toward means in the direction of something."},
    {q:"Finish the sentence: She looked at her ___ to check the time.",
     o:["watch","wash","wallet","water"],
     a:0, why:"A watch tells you the time. Watch is also one of the nouns that adds es to become watches."},
    {q:"Finish the sentence: Please drink some ___ .",
     o:["water","wallet","wander","wasp"],
     a:0, why:"Water is what we drink. The a after w sounds like o."}
  ]
},
{
  id:"spell7", group:"English", name:"Spelling: soft g", topic:"Week 7 &middot; 15 words", color:"var(--spell)", icon:"ic-spell",
  q:[
    {q:"Which one is spelled correctly?",
     o:["bridge","brige","bridje","bridgh"],
     a:0, why:"Bridge is spelled with dge. A bridge carries a road or path over a river."},
    {q:"Which one is spelled correctly?",
     o:["fridge","frige","frije","fridg"],
     a:0, why:"Fridge is spelled with dge. A fridge keeps your food cold."},
    {q:"Which one is spelled correctly?",
     o:["judge","juge","judje","jugde"],
     a:0, why:"Judge is spelled with dge. A judge decides what is fair."},
    {q:"Which one is spelled correctly?",
     o:["garage","garrage","garaje","garag"],
     a:0, why:"Garage ends in ge, with one r. A garage is where a car is kept or repaired."},
    {q:"Which one is spelled correctly?",
     o:["damage","damige","damaje","dammage"],
     a:0, why:"Damage ends in ge. Damage is harm done to something."},
    {q:"Which one is spelled correctly?",
     o:["lodger","lodjer","loger","lodgger"],
     a:0, why:"Lodger is spelled with dge plus er. A lodger pays to live in someone else's house."},
    {q:"Which one is spelled correctly?",
     o:["fudge","fuge","fudje","fudg"],
     a:0, why:"Fudge is spelled with dge. Fudge is a soft, sweet treat."},
    {q:"After a SHORT vowel sound, as in bridge and judge, which ending do we use?",
     o:["dge","ge","j","gg"],
     a:0, why:"After a short vowel sound we use dge: edge, ledge, bridge, judge, fudge. Otherwise we use ge: cage, page, wage, garage."},
    {q:"Which word ends in 'ge', NOT 'dge'?",
     o:["page","ridge","dodge","ledge"],
     a:0, why:"Page ends in ge. Ridge, dodge and ledge all end in dge."},
    {q:"Which word ends in 'dge'?",
     o:["ridge","wage","cage","garage"],
     a:0, why:"Ridge ends in dge. Wage, cage and garage all end in ge."},
    {q:"In all of this week's words, the letter g sounds like...",
     o:["j","the g in go","k","s"],
     a:0, why:"A soft g sounds like j, as in judge, cage and garage. A hard g sounds like the g in go."},
    {q:"Which word means a person who pays to live in someone else's house?",
     o:["lodger","judge","ridge","wage"],
     a:0, why:"A lodger pays to live in someone else's house. A lodge is a small house, often in the countryside."},
    {q:"Which word means the money a person is paid for their work?",
     o:["wage","page","cage","edge"],
     a:0, why:"A wage is the money someone is paid for the work they do."},
    {q:"Which word means a place where a car is kept or repaired?",
     o:["garage","lodge","bridge","ridge"],
     a:0, why:"A garage is where a car is kept or repaired."},
    {q:"Finish the sentence: Be careful, do not sit on the ___ of the chair.",
     o:["edge","cage","page","wage"],
     a:0, why:"The edge is the part right at the end or the side of something."},
    {q:"Finish the sentence: The books were lined up on a narrow ___ on the wall.",
     o:["ledge","lodge","fudge","bridge"],
     a:0, why:"A ledge is a narrow shelf, either on a wall or on a cliff."},
    {q:"Finish the sentence: He had to ___ the ball so that it did not hit him.",
     o:["dodge","lodge","judge","badge"],
     a:0, why:"To dodge is to move quickly out of the way."},
    {q:"Finish the sentence: They stayed in a little ___ up in the mountains.",
     o:["lodge","ledge","ridge","fridge"],
     a:0, why:"A lodge is a small house, often in the countryside or the mountains."},
    {q:"Finish the sentence: The parrot sang inside its ___ .",
     o:["cage","page","wage","edge"],
     a:0, why:"A cage is a box made of bars that keeps an animal or a bird inside."},
    {q:"Finish the sentence: Grandma made chocolate ___ for the party.",
     o:["fudge","judge","ridge","lodge"],
     a:0, why:"Fudge is a soft, sweet treat made with sugar. It is spelled with dge."}
  ]
},
{
  id:"spell5", group:"English", name:"Spelling: silent k and b", topic:"Week 5 &middot; 12 words", color:"var(--spell)", icon:"ic-spell",
  q:[
    {q:"Which one is spelled correctly?",
     o:["lamb","lam","lambe","llamb"],
     a:0, why:"Lamb ends with a silent b. We say lam. A lamb is a baby sheep."},
    {q:"Which one is spelled correctly?",
     o:["climb","clim","climbe","klimb"],
     a:0, why:"Climb ends with a silent b. To climb is to go up something, like a tree."},
    {q:"Which one is spelled correctly?",
     o:["knife","nife","knive","knifh"],
     a:0, why:"Knife begins with a silent k. Remember its plural changes too: knife becomes knives."},
    {q:"Which one is spelled correctly?",
     o:["knock","nock","knok","cnock"],
     a:0, why:"Knock begins with a silent k. To knock is to hit something, like a door."},
    {q:"Which one is spelled correctly?",
     o:["thumb","thum","thumbe","thomb"],
     a:0, why:"Thumb ends with a silent b. Your thumb is the short, thick finger on your hand."},
    {q:"Which one is spelled correctly?",
     o:["knew","knue","kneu","knewe"],
     a:0, why:"Knew begins with a silent k. Knew means you already understood something. Do not mix it up with new, which means not old."},
    {q:"Which one is spelled correctly?",
     o:["crumb","crum","crumbe","krumb"],
     a:0, why:"Crumb ends with a silent b. A crumb is a tiny piece of bread or cake."},
    {q:"Which one is spelled correctly?",
     o:["kneel","neel","kneal","knele"],
     a:0, why:"Kneel begins with a silent k. To kneel is to go down on your knees."},
    {q:"Which one is spelled correctly?",
     o:["comb","coom","combe","kohm"],
     a:0, why:"Comb ends with a silent b. You use a comb to tidy your hair."},
    {q:"Which one is spelled correctly?",
     o:["knot","knott","knote","knopt"],
     a:0, why:"Knot begins with a silent k. A knot is a tie in a rope or a string. Do not mix it up with not, which means no."},
    {q:"Which one is spelled correctly?",
     o:["knit","nitt","knitt","kniet"],
     a:0, why:"Knit begins with a silent k. To knit is to make clothes from wool using needles."},
    {q:"Which letter is SILENT in the word lamb?",
     o:["b","l","a","m"],
     a:0, why:"The b at the end of lamb is silent, so we say lam. Comb, climb, crumb and thumb all have a silent b too."},
    {q:"Which letter is SILENT in the word knee?",
     o:["k","n","e","None of them"],
     a:0, why:"The k at the start of knee is silent, so we say nee. Kneel, knew, knife, knit, knot and knock all have a silent k too."},
    {q:"Which group of words ALL have a silent b?",
     o:["lamb, comb, climb","knee, knife, knot","knock, knit, knew","lamb, knee, knit"],
     a:0, why:"Lamb, comb, climb, crumb and thumb all end with a silent b."},
    {q:"Which group of words ALL begin with a silent k?",
     o:["knee, knife, knock","lamb, comb, thumb","climb, crumb, knit","thumb, knee, comb"],
     a:0, why:"Knee, kneel, knew, knife, knit, knot and knock all begin with a silent k."},
    {q:"Finish the sentence: A baby sheep is called a ___ .",
     o:["lamb","comb","crumb","climb"],
     a:0, why:"A lamb is a baby sheep. The b at the end is silent."},
    {q:"Finish the sentence: She used a ___ to tidy her hair.",
     o:["comb","climb","crumb","lamb"],
     a:0, why:"A comb tidies your hair. The b at the end is silent."},
    {q:"Finish the sentence: He went down on one ___ to tie his shoe.",
     o:["knee","knew","knit","knock"],
     a:0, why:"Your knee is the joint in the middle of your leg. The k at the start is silent."},
    {q:"Finish the sentence: Please ___ on the door before you come in.",
     o:["knock","knot","knit","knee"],
     a:0, why:"To knock is to hit the door so people know you are there. The k at the start is silent."},
    {q:"Finish the sentence: Grandma likes to ___ scarves out of wool.",
     o:["knit","knot","knee","knew"],
     a:0, why:"To knit is to make clothes from wool using needles. The k at the start is silent."}
  ]
},
{
  id:"spell3", group:"English", name:"Spelling: al and all", topic:"Week 3 &middot; 19 words", color:"var(--spell)", icon:"ic-spell",
  q:[
    {q:"Which one is spelled correctly?",
     o:["always","alwayz","allways","alwaies"],
     a:0, why:"Always has only one l: al-ways. It means every time, or all the time."},
    {q:"Which one is spelled correctly?",
     o:["although","allthough","althogh","altho"],
     a:0, why:"Although has one l and ends in -though. It means even though."},
    {q:"Which one is spelled correctly?",
     o:["almost","allmost","almoste","olmost"],
     a:0, why:"Almost has one l: al-most. It means nearly, but not quite."},
    {q:"Which one is spelled correctly?",
     o:["altogether","alltogether","altogather","alltogather"],
     a:0, why:"Altogether has one l: al-together. It means completely, or in total."},
    {q:"Which one is spelled correctly?",
     o:["already","allready","alredy","allredy"],
     a:0, why:"Already has one l: al-ready. It means before now."},
    {q:"Which one is spelled correctly?",
     o:["hospital","hospitle","hospitol","hospittal"],
     a:0, why:"Hospital ends in -al, just like capital, signal, sandal and pedal."},
    {q:"Which one is spelled correctly?",
     o:["occasional","occassional","ocasional","occasionel"],
     a:0, why:"Occasional has two c-letters, one s, and ends in -al. It means happening sometimes, not often."},
    {q:"Which one is spelled correctly?",
     o:["accidental","accidentel","acidental","accidentle"],
     a:0, why:"Accidental has two c-letters and ends in -al. It means happening by accident."},
    {q:"Which one is spelled correctly?",
     o:["special","speshal","specail","speciel"],
     a:0, why:"Special ends in -al even though it sounds like shul. It means better or different from usual."},
    {q:"Which one is spelled correctly?",
     o:["pedal","pedle","peddal","pedall"],
     a:0, why:"Pedal ends in -al. It is the part of a bicycle that you push with your foot."},
    {q:"Which word means a place where sick people are cared for?",
     o:["hospital","capital","sandal","signal"],
     a:0, why:"A hospital cares for sick people. A capital is a main city, a sandal is a shoe, and a signal is a sign."},
    {q:"Which word means what normally happens?",
     o:["usual","special","occasional","accidental"],
     a:0, why:"Usual means normal or ordinary. Its opposite is special, which means different from the usual."},
    {q:"What is the capital of a country?",
     o:["The main city, where the government is","The tallest building in it","The biggest shop in it","The oldest church in it"],
     a:0, why:"A capital is a country's main city. St. George's is the capital of Grenada. A capital letter is also the big letter at the start of a name."},
    {q:"Finish the sentence: A giraffe is very ___ .",
     o:["tall","stall","small","fall"],
     a:0, why:"Tall means high from bottom to top. The giraffe is the tallest animal in the world."},
    {q:"Finish the sentence: Be careful on the wet floor or you might ___ .",
     o:["fall","tall","stall","fill"],
     a:0, why:"To fall is to drop down to the ground."},
    {q:"Finish the sentence: A mouse is ___ , but an elephant is huge.",
     o:["small","stall","smell","tall"],
     a:0, why:"Small means little. It is the opposite of big."},
    {q:"Finish the sentence: We bought mangoes from a ___ in the market.",
     o:["stall","stale","small","tall"],
     a:0, why:"A stall is a small stand or table where things are sold, like the ones in a market."},
    {q:"Finish the sentence: I like mangoes and I ___ like bananas.",
     o:["also","already","always","almost"],
     a:0, why:"Also means as well, or in addition."},
    {q:"Finish the sentence: The traffic light gave the ___ to stop.",
     o:["signal","sandal","special","capital"],
     a:0, why:"A signal is a sign that tells you something, like a traffic light telling cars to stop."},
    {q:"Finish the sentence: She wore a ___ on each foot to the beach.",
     o:["sandal","signal","stall","pedal"],
     a:0, why:"A sandal is an open shoe with straps. Two of them are a pair of sandals."}
  ]
},
{
  id:"soc", group:"Social Studies", name:"Social Studies", topic:"Family, heritage and groups", color:"var(--soc)", icon:"ic-soc",
  q:[
    {q:"What is a family?",
     o:["A group of people related by blood, marriage or adoption who care for one another","A group of people who live on the same street","A group of people who go to the same school","A group of friends who like the same games"],
     a:0, why:"Families are joined by blood, marriage or adoption. A family gives love, protection and nurture, and supports each other in difficult times."},
    {q:"A traditional or nuclear family has...",
     o:["Two married parents and their children","Grandparents, aunts, uncles and cousins","One parent and their children","Only stepbrothers and stepsisters"],
     a:0, why:"Nuclear means two married parents and their children. Every family is different, even when families are alike in some ways."},
    {q:"Which family includes grandparents, aunts, uncles and cousins?",
     o:["An extended family","A nuclear family","A single parent family","A school family"],
     a:0, why:"An extended family includes grandparents, grandchildren, aunts, uncles, cousins, nieces, nephews and other relatives."},
    {q:"Family traditions are sometimes also called...",
     o:["Rituals","Rules","Heritage","Chores"],
     a:0, why:"Traditions, or rituals, are things a family does together. They can be yearly, like Christmas, or often, like sharing a meal every evening."},
    {q:"What is heritage?",
     o:["What is handed down to you from your parents, grandparents and ancestors","The house that your family lives in","The money that your family saves","The subjects you study at school"],
     a:0, why:"Heritage is what is passed down to you, and belonging to a group that shares traditions, beliefs, culture and history. It is part of your identity."},
    {q:"Amerindian people are...",
     o:["The descendants of the first people who lived in the Caribbean","People whose ancestors came from India","People whose ancestors came from Europe","People whose ancestors came from China"],
     a:0, why:"Amerindians are descended from the original inhabitants of the Caribbean, who lived here before the Europeans arrived about 600 years ago."},
    {q:"Many Caribbean people have ancestors who were brought from...",
     o:["Africa, during enslavement","Canada, to build roads","Australia, to farm","Japan, to fish"],
     a:0, why:"Many Caribbean people have ancestors brought from Africa during enslavement. Later many labourers came from India, and others came from Europe, South America and China."},
    {q:"What is the most common surname in Grenada?",
     o:["Charles","Joseph","Williams","Clarke"],
     a:0, why:"Charles is the most common surname in Grenada. In Barbados it is Clarke, and in Dominica, Antigua and Barbuda and St. Lucia it is Joseph."},
    {q:"Which surname comes from the landscape, not from a job?",
     o:["Wood","Baker","Miller","Robertson"],
     a:0, why:"Wood and Gates come from features of the landscape. Baker and Miller come from jobs, Strong and Little describe a person, and Robertson means Robert's son."},
    {q:"Which one is a FORMAL group?",
     o:["A political party","Friends together on a beach","Children playing in a park","People waiting in a hair salon"],
     a:0, why:"Formal groups, like political parties, can be important parts of communities and countries. Informal groups often exist just for fun."},
    {q:"A school is which type of group?",
     o:["Educational","Political","Religious","Ethnic"],
     a:0, why:"Schools are educational groups. Inside a school, your class and the other students in your grade form a peer group."},
    {q:"Why do school students wear a uniform?",
     o:["So everyone is equal and the group has its own identity","So that they can run faster","So that they never get dirty","So that teachers can count them"],
     a:0, why:"A uniform makes everyone equal, gives the group an identity and a community, and means you do not have to decide what to wear each day."},
    {q:"People who work together are sometimes called...",
     o:["Colleagues","Cousins","Ancestors","Neighbours"],
     a:0, why:"People who work together are colleagues. Some groups of workers wear a uniform too."},
    {q:"One important way that Caribbean culture is expressed is through...",
     o:["Carnival","Snow festivals","Ice hockey","Tulip parades"],
     a:0, why:"Carnival is one important way Caribbean culture is expressed. Cultural groups also include choirs, dance troupes, and book and art groups."}
  ]
},
{
  id:"carib", group:"Social Studies", name:"My Caribbean", topic:"Grenada, water bodies and water links", color:"var(--carib)", icon:"ic-carib",
  q:[
    {q:"Grenada is in which part of the Caribbean?",
     o:["The southern Caribbean","The northern Caribbean","The middle of the Atlantic","The Pacific"],
     a:0, why:"Grenada is in the southern Caribbean, and it is part of the Lesser Antilles."},
    {q:"Grenada is part of which island group?",
     o:["The Lesser Antilles","The Greater Antilles","The Bahamas","The Galapagos"],
     a:0, why:"Grenada is part of the Lesser Antilles."},
    {q:"Which islands are NEAREST to Grenada?",
     o:["Saint Vincent and the Grenadines, Trinidad and Tobago, and Barbados","Belize and Guatemala","Jamaica and Cuba","Haiti and the Bahamas"],
     a:0, why:"The nearest islands are Saint Vincent and the Grenadines, Trinidad and Tobago, and Barbados."},
    {q:"Grenada is NORTH of which country?",
     o:["Trinidad and Tobago","Saint Vincent and the Grenadines","Barbados","Belize"],
     a:0, why:"Grenada is north of Trinidad and Tobago, and south of Saint Vincent and the Grenadines."},
    {q:"Grenada is SOUTH of which country?",
     o:["Saint Vincent and the Grenadines","Trinidad and Tobago","Guatemala","Barbados"],
     a:0, why:"Grenada is south of Saint Vincent and the Grenadines, and north of Trinidad and Tobago."},
    {q:"Grenada is SOUTHWEST of which island?",
     o:["Barbados","Trinidad and Tobago","Belize","Jamaica"],
     a:0, why:"Grenada is southwest of Barbados."},
    {q:"Which Caribbean places are FURTHEST away from Grenada?",
     o:["Belize and Guatemala","Barbados and Trinidad","Saint Vincent and Saint Lucia","Tobago and Carriacou"],
     a:0, why:"The Caribbean places furthest from Grenada are Belize and Guatemala."},
    {q:"Grenada is surrounded by...",
     o:["The Caribbean Sea and the Atlantic Ocean","The Pacific Ocean only","The Indian Ocean","The Mediterranean Sea"],
     a:0, why:"Grenada is an island surrounded by the Caribbean Sea and the Atlantic Ocean."},
    {q:"What is a water body?",
     o:["A large area of water","A boat that carries people","A kind of fish","A beach made of sand"],
     a:0, why:"A water body is a large area of water. Oceans, seas, rivers and lakes are all water bodies."},
    {q:"Which one is an example of a water body?",
     o:["A lake","A mountain","A forest","A road"],
     a:0, why:"Oceans, seas, rivers and lakes are water bodies. Grenada is an island surrounded by water."},
    {q:"Ships carrying goods from one island to the next is an example of...",
     o:["Trade","Fishing","Tourism","Cultural exchange"],
     a:0, why:"Trade is one of the four ways water connects Caribbean people. Ships transport goods from one island to the next."},
    {q:"Sharing food, music, languages and traditions between islands is called...",
     o:["Cultural exchange","Trade","Fishing","Travel"],
     a:0, why:"Cultural exchange happens when people travel and interact, and share food, music, languages and traditions."},
    {q:"What are the FOUR ways water connects Caribbean people?",
     o:["Travel, trade, fishing and cultural exchange","Rain, rivers, lakes and seas","Boats, ships, planes and cars","Food, music, language and dance"],
     a:0, why:"The four ways are travel, trade, fishing and cultural exchange."}
  ]
},
{
  id:"symbols", group:"Social Studies", name:"National Symbols", topic:"Anthem, pledge, flag and coat of arms", color:"var(--symbols)", icon:"ic-symbols",
  q:[
    {q:"What is Grenada's national anthem called?",
     o:["Hail Grenada","Isle of Spice","Our Grenada","Spice Island Song"],
     a:0, why:"Grenada's national anthem is called Hail Grenada."},
    {q:"The national ANTHEM is...",
     o:["A patriotic song that expresses love and pride for our country","A promise we make","A law we must obey","A poem about the sea"],
     a:0, why:"The national anthem is a patriotic song that expresses love and pride for our country."},
    {q:"The national PLEDGE is...",
     o:["A promise expressing loyalty and commitment to Grenada","A song we sing","A flag we raise","A story about our history"],
     a:0, why:"The national pledge is a promise that expresses loyalty and commitment to Grenada."},
    {q:"Do we SING or RECITE the national pledge?",
     o:["We recite it","We sing it","We dance to it","We write it"],
     a:0, why:"We recite the pledge and say the words thoughtfully. The anthem is sung or listened to."},
    {q:"Which one is a reason we sing the national anthem?",
     o:["To unite us as one people","To start the school day","To choose a leader","To learn new songs"],
     a:0, why:"We sing it to show love, pride and respect for our country, to unite us as one people, and to remember our country's values and hopes."},
    {q:"Which one is a reason we recite the national pledge?",
     o:["To promise loyalty and remind us of our responsibilities","To win a prize","To change the law","To end the school day"],
     a:0, why:"Reciting the pledge promises loyalty, reminds us of our responsibilities, encourages good behaviour, shows love for our country and encourages unity."},
    {q:"Who designed Grenada's national flag?",
     o:["Anthony C. George","Irva Blackette","Louis Masanto","Christopher Columbus"],
     a:0, why:"Anthony C. George designed Grenada's national flag."},
    {q:"Who wrote the WORDS of the national anthem?",
     o:["Irva Blackette, born Baptiste","Anthony C. George","Louis Masanto","Christopher Columbus"],
     a:0, why:"Irva Blackette (nee Baptiste) wrote the words for the national anthem. Louis Masanto arranged it."},
    {q:"Who ARRANGED the national anthem?",
     o:["Louis Masanto","Irva Blackette","Anthony C. George","Christopher Columbus"],
     a:0, why:"Louis Masanto arranged the anthem, and Irva Blackette wrote the words."},
    {q:"What does the RED on Grenada's flag represent?",
     o:["Courage, vitality and the desire for freedom","Wisdom and sunshine","Fertile land and agriculture","The seven parishes"],
     a:0, why:"Red stands for courage, vitality and the desire for freedom."},
    {q:"What does the GOLD, or yellow, on the flag represent?",
     o:["Wisdom, sunshine, warmth and friendliness","Courage and freedom","Fertile land and vegetation","The spice industry"],
     a:0, why:"Gold stands for wisdom, sunshine, warmth and friendliness."},
    {q:"What does the GREEN on the flag represent?",
     o:["Fertile land, vegetation and agriculture","Courage and freedom","Wisdom and sunshine","The seven parishes"],
     a:0, why:"Green stands for our fertile land, vegetation and agriculture."},
    {q:"What do the SEVEN GOLD STARS represent?",
     o:["The seven parishes and the hopes of the nation","Seven islands","Seven spices","Seven years of freedom"],
     a:0, why:"The seven gold stars represent the seven parishes and the hopes and aspirations of the nation."},
    {q:"What does the NUTMEG on the flag represent?",
     o:["Grenada's reputation as the Isle of Spice","The colour of the land","The courage of the people","The seven parishes"],
     a:0, why:"The nutmeg represents Grenada's reputation as the Isle of Spice and its connection to the spice industry."},
    {q:"The shield on the Coat of Arms is divided into how many sections?",
     o:["Four","Two","Seven","Three"],
     a:0, why:"The shield is divided into four sections, with pictures representing parts of Grenada's history and heritage."},
    {q:"What does the SHIP on the Coat of Arms represent?",
     o:["Christopher Columbus's arrival in Grenada","Fishing boats of today","Trade with Barbados","The Atlantic Ocean"],
     a:0, why:"The ship represents Christopher Columbus's arrival in Grenada and the island's historical past."},
    {q:"What does the LION on the Coat of Arms represent?",
     o:["Strength","Wisdom","Friendliness","Farming"],
     a:0, why:"The lion represents strength, and is part of the historical imagery on the coat of arms."},
    {q:"What does the CROSS on the Coat of Arms reflect?",
     o:["The island's historical and religious heritage","The four parishes","The spice trade","The shape of the island"],
     a:0, why:"The cross reflects the island's historical and religious heritage."},
    {q:"What does the MOTTO encourage us to do?",
     o:["Be mindful of God, work towards progress and live together in unity","Travel the world","Grow only nutmeg","Keep to ourselves"],
     a:0, why:"The motto encourages us to be mindful of God, work towards progress and live together in unity."},
    {q:"Why should we appreciate our national symbols?",
     o:["They remind us of our history and culture and unite us as Grenadians","They are worth a lot of money","They are printed on our books","They are new inventions"],
     a:0, why:"National symbols represent our country, remind us of our history and culture, help unite us as Grenadians and make us feel proud."}
  ]
},
{
  id:"christ", group:"Christ Light", name:"Christ Light", topic:"Term 1 lessons", color:"var(--christ)", icon:"ic-christ",
  q:[
    {q:"Who announced the births of John and Jesus?",
     o:["The angel Gabriel","Zechariah","Simeon","John the Baptist"],
     a:0, why:"Gabriel announced the births of John and Jesus. God reminded Zechariah and Mary that his promises always come true."},
    {q:"What did God remind Zechariah and Mary about?",
     o:["That his promises always come true","That they should travel to Egypt","That they should build a temple","That they should go to Nazareth"],
     a:0, why:"God reminded them that his promises always come true, and he reminds us of the same thing. We trust God's promises and encourage others to do the same."},
    {q:"How did Zechariah show his faith in God?",
     o:["He obeyed God, praised him and proclaimed his Word","He stayed quiet and told nobody","He travelled to Egypt","He brought gifts to the temple"],
     a:0, why:"Zechariah obeyed God, praised him and proclaimed his Word. We can show our faith the same way, with the Holy Spirit's help."},
    {q:"How did the shepherds show their joy at Jesus' birth?",
     o:["They searched for their Savior, told others and praised God","They stayed in the fields with the sheep","They brought gold to the temple","They wrote a song about him"],
     a:0, why:"The shepherds searched for their Savior, told others about him, and praised God. The birth of our Savior is the most important reason for Christmas joy."},
    {q:"Who praised God and proclaimed that Jesus was the Savior when he was brought to the temple?",
     o:["Simeon and Anna","Mary and Joseph","The shepherds","The wise men"],
     a:0, why:"Simeon and Anna praised God and proclaimed Jesus to be the Savior. God wants us to celebrate Christmas by doing the same."},
    {q:"How did the wise men honour the child Jesus?",
     o:["They worshiped him as their King and brought him precious gifts","They wrote his name in the temple","They took him to Egypt","They taught him to read"],
     a:0, why:"The wise men worshiped Jesus as their King and brought him precious gifts. God leads us to know our Savior and worship him as our King."},
    {q:"Where did God lead Joseph to keep Jesus safe?",
     o:["Egypt, and later Nazareth","Bethlehem","Jerusalem","The temple"],
     a:0, why:"In The Escape to Egypt, God led Joseph to keep Jesus our Savior safe in Egypt and Nazareth."},
    {q:"In the lesson about the escape to Egypt, who does God use to keep us safe?",
     o:["Our parents","Our teachers","Our friends","Our neighbours"],
     a:0, why:"God uses our parents to keep us safe. We thank God for our parents and pray for them."},
    {q:"How old was Jesus in the lesson about him staying at the temple?",
     o:["Twelve","Eight","Ten","Thirty"],
     a:0, why:"The lesson is called The Twelve-Year-Old Jesus. He obeyed both his earthly parents and his heavenly Father."},
    {q:"Which commandments did Jesus obey for us?",
     o:["The Third and Fourth Commandments","The First and Second","The Fifth and Sixth","The Ninth and Tenth"],
     a:0, why:"Jesus obeyed the Third and Fourth Commandments for us. We thank him by following his example of obedience."},
    {q:"How did John the Baptist prepare the way for Jesus?",

/* ---------- storage ---------- */
var BEST_KEY="qq-best-v1", SND_KEY="qq-sound-v1";
function loadBest(){ try{ return JSON.parse(localStorage.getItem(BEST_KEY)||"{}")||{}; }catch(e){ return {}; } }
function saveBest(b){ try{ localStorage.setItem(BEST_KEY, JSON.stringify(b)); }catch(e){} }
var best = loadBest();
var soundOn = true;
try{ if(localStorage.getItem(SND_KEY)==="off") soundOn=false; }catch(e){}

/* ---------- sound ---------- */
var actx=null;
function tone(freq, start, dur, type, vol){
  var o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0, actx.currentTime+start);
  g.gain.linearRampToValueAtTime(vol, actx.currentTime+start+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+start+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(actx.currentTime+start); o.stop(actx.currentTime+start+dur+0.02);
}
function sfx(kind){
  if(!soundOn) return;
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    if(kind==="ok"){ tone(659,0,.16,"triangle",.16); tone(988,.1,.26,"triangle",.14); }
    else if(kind==="no"){ tone(196,0,.22,"sine",.13); }
    else { [523,659,784,1047].forEach(function(f,i){ tone(f,i*0.1,.3,"triangle",.14); }); }
  }catch(e){}
}

/* ---------- confetti ---------- */
var cv=document.getElementById("fx"), cx=cv.getContext("2d"), bits=[], raf=null;
var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function sizeCanvas(){ var r=Math.min(window.devicePixelRatio||1,2); cv.width=innerWidth*r; cv.height=innerHeight*r; cx.setTransform(r,0,0,r,0,0); }
sizeCanvas(); addEventListener("resize", sizeCanvas);
function burst(n, cols){
  if(reduce) return;
  for(var i=0;i<n;i++){
    bits.push({x:innerWidth*(.2+Math.random()*.6), y:innerHeight*.35+Math.random()*60,
      vx:(Math.random()-.5)*8, vy:-6-Math.random()*7,
      s:5+Math.random()*7, r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3,
      c:cols[i%cols.length], life:90+Math.random()*40});
  }
  if(!raf) raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  for(var i=bits.length-1;i>=0;i--){
    var b=bits[i];
    b.vy+=0.28; b.x+=b.vx; b.y+=b.vy; b.r+=b.vr; b.life--;
    if(b.life<=0 || b.y>innerHeight+40){ bits.splice(i,1); continue; }
    cx.save(); cx.translate(b.x,b.y); cx.rotate(b.r); cx.fillStyle=b.c;
    cx.fillRect(-b.s/2,-b.s/2,b.s,b.s*0.6); cx.restore();
  }
  if(bits.length) raf=requestAnimationFrame(tick);
  else { raf=null; cx.clearRect(0,0,innerWidth,innerHeight); }
}
var PARTY=["#F4761B","#7A4DFF","#00A28C","#DD3F7C","#F0A415","#3AA0FF"];

/* ---------- helpers ---------- */
var app=document.getElementById("app");
function svg(id, cls){ return '<svg'+(cls?' class="'+cls+'"':'')+' aria-hidden="true"><use href="#'+id+'" xlink:href="#'+id+'"></use></svg>'; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* ---------- state ---------- */
var S=null, order=[], qi=0, score=0, locked=false, optIdx=[];

/* ---------- menu ---------- */
function renderMenu(){
  function cardHTML(s){
    var b = best[s.id];
    return '<button class="card" style="--c:'+s.color+'" data-go="'+s.id+'">'+
      '<span class="ic">'+svg(s.icon)+'</span>'+
      '<span class="name">'+s.name+'</span>'+
      '<p class="meta">'+s.topic+'<br>'+s.q.length+' questions</p>'+
      (b!==undefined ? '<span class="best">'+svg("ic-star")+'Best: '+b+' / '+s.q.length+'</span>' : '')+
    '</button>';
  }
  var sections="", cur=null, buf="";
  function flush(){ if(cur!==null) sections+='<section class="group"><h2 class="grouphead">'+cur+'</h2><div class="grid">'+buf+'</div></section>'; }
  for(var gi=0; gi<SUBJECTS.length; gi++){
    if(SUBJECTS[gi].group!==cur){ flush(); cur=SUBJECTS[gi].group; buf=""; }
    buf+=cardHTML(SUBJECTS[gi]);
  }
  flush();

  app.innerHTML =
    '<p class="eyebrow">Grade 3 &middot; Term 1</p>'+
    '<h1>Quiz <span class="pop">Quest</span></h1>'+
    '<p class="sub">Pick a subject and collect stars. Every question comes straight from your own class notes, so this is real practice.</p>'+
    sections+
    '<div class="tipbar"><span><b>Word Study test: Friday 30th October.</b><br>Every week&rsquo;s spelling list is here, so you can go back over the old ones too.</span>'+
      '<button class="ghost" data-snd>Sound: '+(soundOn?"on":"off")+'</button></div>';
  scrollTo(0,0);
}

/* ---------- quiz ---------- */
function startQuiz(id){
  S = SUBJECTS.filter(function(s){ return s.id===id; })[0];
  order = shuffle(S.q.map(function(_,i){ return i; }));
  qi=0; score=0;
  renderQuestion();
}

function renderQuestion(){
  locked=false;
  var q = S.q[order[qi]];
  optIdx = shuffle(q.o.map(function(_,i){ return i; }));
  var letters="ABCD";
  var opts = optIdx.map(function(orig,pos){
    return '<button class="opt" data-pick="'+pos+'"><span class="ltr">'+letters[pos]+'</span>'+
           '<span class="txt">'+q.o[orig]+'</span><span class="mark">'+svg("ic-check")+'</span></button>';
  }).join("");

  app.innerHTML =
    '<div style="--c:'+S.color+'">'+
      '<div class="topbar">'+
        '<button class="ghost" data-menu>&larr; Menu</button>'+
        '<span class="title">'+S.name+'</span>'+
        '<span class="pill">'+svg("ic-star")+'<span>'+score+'</span></span>'+
      '</div>'+
      '<div class="track"><i style="width:'+(qi/S.q.length*100)+'%"></i></div>'+
      '<p class="count">QUESTION '+(qi+1)+' OF '+S.q.length+'</p>'+
      '<div class="qcard">'+
        '<h2 class="qtext">'+q.q+'</h2>'+
        '<div class="opts">'+opts+'</div>'+
        '<div id="fbslot" aria-live="polite"></div>'+
      '</div>'+
    '</div>';
  scrollTo(0,0);
}

function pick(pos){
  if(locked) return;
  locked=true;
  var q = S.q[order[qi]];
  var right = optIdx[pos]===q.a;
  var nodes = app.querySelectorAll(".opt");
  for(var i=0;i<nodes.length;i++){
    nodes[i].disabled = true;
    if(optIdx[i]===q.a){ nodes[i].classList.add("right"); nodes[i].querySelector(".mark").innerHTML=svg("ic-check"); }
    else if(i===pos){ nodes[i].classList.add("wrong"); nodes[i].querySelector(".mark").innerHTML=svg("ic-x"); }
    else nodes[i].classList.add("dim");
  }
  if(right){ score++; sfx("ok"); burst(26, PARTY); }
  else sfx("no");

  var head = right
    ? ["Yes! Nailed it.","Correct! Well done.","That is right!","Exactly right!"][Math.floor(Math.random()*4)]
    : "Not this time - the answer is " + q.o[q.a];
  app.querySelector(".pill span").textContent = score;
  app.querySelector(".track i").style.width = ((qi+1)/S.q.length*100)+"%";
  app.querySelector("#fbslot").innerHTML =
    '<div class="fb '+(right?"ok":"no")+'"><h3>'+head+'</h3><p>'+q.why+'</p></div>'+
    '<button class="big" data-next>'+(qi+1<S.q.length ? "Next question &rarr;" : "See my score &rarr;")+'</button>';
}

function next(){
  qi++;
  if(qi < S.q.length) renderQuestion();
  else renderResult();
}

function renderResult(){
  var total=S.q.length, pct=Math.round(score/total*100);
  var stars = pct>=90?3 : pct>=70?2 : pct>=50?1 : 0;
  if(best[S.id]===undefined || score>best[S.id]){ best[S.id]=score; saveBest(best); }

  var msg;
  if(stars===3) msg="You have really learned this. Three stars is the top score.";
  else if(stars===2) msg="Strong work. Read the blue notes on the ones you missed and try for three stars.";
  else if(stars===1) msg="Good start. Go through it once more - the explanations tell you exactly why.";
  else msg="This one is still new. Try it again and read each explanation carefully. You will get there.";

  var starRow="";
  for(var i=0;i<3;i++) starRow += svg("ic-star", i<stars ? "lit" : "");

  if(stars>=2){ sfx("win"); burst(70, PARTY); }

  app.innerHTML =
    '<div style="--c:'+S.color+'">'+
      '<div class="topbar"><button class="ghost" data-menu>&larr; Menu</button>'+
        '<span class="title">'+S.name+' &middot; finished</span></div>'+
      '<div class="qcard result">'+
        '<div class="ring" style="--pct:'+pct+'"><div class="inner">'+
          '<span class="num">'+score+'</span><span class="of">out of '+total+'</span></div></div>'+
        '<div class="stars">'+starRow+'</div>'+
        '<h2>'+(stars===3?"Perfect run!":stars===2?"Nicely done!":stars===1?"Keep going!":"Let us try again")+'</h2>'+
        '<p class="msg">'+msg+'</p>'+
        '<div class="row">'+
          '<button class="big" data-again>Try this one again</button>'+
          '<button class="big alt" data-menu>Pick another subject</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  scrollTo(0,0);
}

/* ---------- events ---------- */
app.addEventListener("click", function(e){
  var t = e.target.closest("button");
  if(!t) return;
  if(t.dataset.go)            startQuiz(t.dataset.go);
  else if(t.dataset.menu!==undefined)  renderMenu();
  else if(t.dataset.pick!==undefined)  pick(+t.dataset.pick);
  else if(t.dataset.next!==undefined)  next();
  else if(t.dataset.again!==undefined) startQuiz(S.id);
  else if(t.dataset.snd!==undefined){
    soundOn=!soundOn;
    try{ localStorage.setItem(SND_KEY, soundOn?"on":"off"); }catch(err){}
    t.textContent="Sound: "+(soundOn?"on":"off");
    if(soundOn) sfx("ok");
  }
});

renderMenu();
</script>
